# Pexels videos and photos for the Wound landing (secret PEXELS_API_KEY). Two steps:
# search (contact sheets + manifest) and fetch (the picked media, optimized). Results go to the
# `wound-media` branch for review. It never touches a server or the theme itself.
name: Medios Wound (Pexels)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'search o fetch'
        default: search
      picks:
        description: 'Para fetch: slot=v:ID o slot=p:ID, separados por coma'
        default: ''
  push:
    branches: ['claude/**']
    paths: ['.github/scripts/wound-pexels.json', '.github/scripts/wound-pexels.py', '.github/workflows/wound-pexels.yml', '.github/scripts/wound-picks.txt']

permissions:
  contents: write

concurrency:
  group: wound-pexels
  cancel-in-progress: false

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la rama wound-media
        run: |
          git fetch -q origin wound-media && git worktree add -q pub origin/wound-media || mkdir -p pub

      - name: Buscar o descargar
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -o pipefail
          pip install -q requests pillow
          # a push with wound-picks.txt means fetch those picks; otherwise the manual inputs (default search)
          MODE="${{ inputs.mode }}"; PICKS="${{ inputs.picks }}"
          if [ -z "$MODE" ] && [ -s .github/scripts/wound-picks.txt ] && git diff --name-only HEAD~1 HEAD | grep -q wound-picks.txt; then
            MODE=fetch; PICKS="$(grep -v '^#' .github/scripts/wound-picks.txt | tr '\n' ',' )"
          fi
          export MODE="${MODE:-search}" PICKS
          python .github/scripts/wound-pexels.py 2>&1 | tee log.txt

      - name: Publicar en la rama wound-media
        if: always()
        run: |
          cd pub
          [ -d .git ] || [ -f .git ] || git init -q -b wound-media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p sheets media
          cp -r ../out/sheets/. sheets/ 2>/dev/null || true
          cp -r ../out/media/. media/ 2>/dev/null || true
          cp ../out/manifest.json . 2>/dev/null || true
          cp ../log.txt . 2>/dev/null || true
          git add -A
          git commit -qm "Medios wound de ${GITHUB_SHA::7}" || echo "sin cambios"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:wound-media
